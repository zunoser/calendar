name: Generate calendar

on:
  issues:
    types: [opened, edited, deleted, closed, reopened, transferred]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-calendar
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Test generator
        run: python3 -m unittest discover -s tests -v

      - name: Generate calendar.ics
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: python3 scripts/generate_calendar.py

      - name: Commit changes
        run: |
          if git diff --quiet -- calendar.ics; then
            echo "calendar.ics is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics
          git commit -m "chore: update calendar.ics"
          git push
