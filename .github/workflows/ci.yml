name: ci

on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm test
      - run: pnpm test:integration
