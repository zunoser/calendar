name: daily

on:
  schedule:
    - cron: "0 15 * * *" # 0:00 JST
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node

      - run: pnpm zunocal check --config config.ci.jsonc
        env:
          TOKEN: ${{ github.token }}
      - run: pnpm zunocal close --config config.ci.jsonc
        env:
          TOKEN: ${{ github.token }}
      - run: pnpm zunocal ics --config config.ci.jsonc --name ずのさー
        env:
          TOKEN: ${{ github.token }}
      - name: Update calendar SVGs
        run: |
          current_month=$(date +%Y-%m)
          next_month=$(date -d "${current_month}-01 +1 month" +%Y-%m)
          rand=$(openssl rand -hex 6)
          current_svg="assets/calendar-current-$rand.svg"
          next_svg="assets/calendar-next-$rand.svg"

          rm -f assets/calendar-*.svg
          pnpm zunocal svg --config config.ci.jsonc --month "$current_month" --output "$current_svg"
          pnpm zunocal svg --config config.ci.jsonc --month "$next_month" --output "$next_svg"

          pnpm zunocal readme "$current_svg" --alt "今月のカレンダー" --tag "calendar:current"
          pnpm zunocal readme "$next_svg" --alt "来月のカレンダー" --tag "calendar:next"

        env:
          TOKEN: ${{ github.token }}

      - name: Check diff
        id: diff
        run: git diff --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update calendar"
          git push
