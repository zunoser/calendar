name: daily

on:
  schedule:
    - cron: "0 15 * * *" # 0:00 JST
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node

      - run: pnpm zunocal check --config config.ci.jsonc
        env:
          TOKEN: ${{ github.token }}
      - run: pnpm zunocal close --config config.ci.jsonc
        env:
          TOKEN: ${{ github.token }}
      - run: pnpm zunocal ics --config config.ci.jsonc --name ずのさー
        env:
          TOKEN: ${{ github.token }}
      - run: pnpm zunocal svg render --config config.ci.jsonc --month current --output assets/calendar-0.svg
        env:
          TOKEN: ${{ github.token }}
      - run: pnpm zunocal svg render --config config.ci.jsonc --month next --output assets/calendar-1.svg
        env:
          TOKEN: ${{ github.token }}
      - run: pnpm zunocal svg publish --current assets/calendar-0.svg --next assets/calendar-1.svg --readme README.md # zizmor: ignore[use-trusted-publishing]

      - name: Check diff
        id: diff
        run: git diff --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update calendar"
          git push
