name: daily

on:
  schedule:
    - cron: "0 15 * * *" # 0:00 JST
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node

      - run: pnpm zunocal check --config config.ci.jsonc
        env:
          TOKEN: ${{ github.token }}
      - run: pnpm zunocal close --config config.ci.jsonc
        env:
          TOKEN: ${{ github.token }}
      - run: pnpm zunocal ics --config config.ci.jsonc --name ずのさー
        env:
          TOKEN: ${{ github.token }}
      - name: Update calendar SVGs
        run: |
          month=$(date +%Y-%m)
          current="assets/calendar-$(openssl rand -hex 6).svg"
          next="assets/calendar-$(openssl rand -hex 6).svg"
          pnpm zunocal svg --config config.ci.jsonc --month "$month" --output "$current"
          pnpm zunocal svg --config config.ci.jsonc --month "$(date -d "${month}-01 +1 month" +%Y-%m)" --output "$next"
          pnpm zunocal readme --current "$current" --next "$next" --readme README.md
        env:
          TOKEN: ${{ github.token }}

      - name: Check diff
        id: diff
        run: git diff --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update calendar"
          git push
