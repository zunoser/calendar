name: daily

on:
  schedule:
    - cron: "0 0 * * *" # 9:00 JST
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] credentials are required for git push
          persist-credentials: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm zunocal check --config config.ci.jsonc
      - run: pnpm zunocal close --config config.ci.jsonc
      - run: pnpm zunocal ics --config config.ci.jsonc --name ずのさー
      - run: pnpm zunocal svg --config config.ci.jsonc

      - name: Version SVG filenames
        run: |
          for index in 0 1; do
            image="assets/calendar-${index}.svg"
            hash=$(git hash-object "$image")
            versioned_image="assets/calendar-${index}-${hash}.svg"
            rm -f assets/calendar-"${index}"-*.svg
            mv "$image" "$versioned_image"
            sed -i -E "s#assets/calendar-${index}[^)]*#${versioned_image}#" README.md
          done

      - name: Check diff
        id: diff
        run: git diff --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update calendar"
          git push
