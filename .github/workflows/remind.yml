name: remind

on:
  schedule:
    - cron: "0 9 * * *" # 18:00 JST

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Remind three days before
        run: pnpm zunocal remind 3d --config config.ci.jsonc

      - name: Remind one day before
        run: pnpm zunocal remind 1d --config config.ci.jsonc
