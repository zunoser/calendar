name: remind

on:
  schedule:
    - cron: "0 14 * * *" # 23:00 JST: 開始日 (00:00 JST) の1時間前
    - cron: "0 15 * * *" # 00:00 JST: 開始日の1日前
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Remind one hour before
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        run: pnpm zunocal remind 1h --config config.ci.jsonc

      - name: Remind one day before
        if: github.event.schedule == '0 15 * * *' || github.event_name == 'workflow_dispatch'
        run: pnpm zunocal remind 1d --config config.ci.jsonc
